# Producción (VPS). Uso:
#   cp .env.production.example .env   (y completar)
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carteleria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-carteleria_db}
    # Sin puertos publicados: solo el backend accede por la red interna de Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carteleria_user} -d ${POSTGRES_DB:-carteleria_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    restart: always
    # Sin puertos publicados: se accede a través de Caddy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carteleria_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carteleria_db}?schema=public
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Definí ADMIN_USERNAME en .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Definí ADMIN_PASSWORD en .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      # Solo los archivos del reproductor web (no todo el proyecto)
      - ./player-app/index.html:/player-app/index.html:ro
      - ./player-app/renderer.js:/player-app/renderer.js:ro
      - ./player-app/config.js:/player-app/config.js:ro

  dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "" # mismo origen: Caddy reparte /api al backend
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Definí DOMAIN en .env (ej. carteleria.tudominio.com)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados HTTPS
      - caddy_config:/config
    depends_on:
      - backend
      - dashboard

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
