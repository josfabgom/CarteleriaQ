services:
  db:
    image: postgres:15-alpine
    container_name: carteleria_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carteleria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-carteleria_db}
    # Solo accesible desde la máquina local; el backend usa la red interna de Docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carteleria_user} -d ${POSTGRES_DB:-carteleria_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: carteleria_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carteleria_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carteleria_db}?schema=public
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Definí ADMIN_USERNAME en .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Definí ADMIN_PASSWORD en .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads # Medios persistentes
      # Reproductor servido en /player (solo los archivos web)
      - ./player-app/index.html:/player-app/index.html:ro
      - ./player-app/boot.js:/player-app/boot.js:ro
      - ./player-app/renderer.js:/player-app/renderer.js:ro
      - ./player-app/player.css:/player-app/player.css:ro
      - ./player-app/manifest.json:/player-app/manifest.json:ro
      - ./player-app/config.js:/player-app/config.js:ro

  dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: carteleria_dashboard
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
