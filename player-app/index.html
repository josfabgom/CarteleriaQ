<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Cartelería Digital</title>
</head>
<body class="layout-split transition-fade">

  <!-- Sección Izquierda: Carrusel -->
  <div id="media-container">
    <div class="media-element active" style="background:linear-gradient(135deg,#1e3a8a,#0f172a)"></div>
  </div>

  <!-- Sección Derecha: Precios -->
  <div id="price-container">
    <div class="header-precios">Menú de Hoy</div>
    <div class="price-list" id="price-list-container">
      <!-- Los precios se inyectarán por JS -->
    </div>
  </div>

  <!-- boot.js carga player.css y renderer.js (la versión actualizada por aire o la que trae la app) -->
  <script src="./config.js"></script>
  <script src="./boot.js"></script>
</body>
</html>
