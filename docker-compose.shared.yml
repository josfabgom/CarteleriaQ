# Para un servidor donde 80/443 ya los usa otro proyecto: sin Caddy público.
# CarteleriaQ queda aislado (red y volúmenes propios) y solo escucha en 127.0.0.1:8095.
#   docker compose -p carteleriaq -f docker-compose.shared.yml up -d --build
# Acceso de prueba: ssh -L 8095:127.0.0.1:8095 usuario@servidor  ->  http://localhost:8095
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carteleria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-carteleria_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carteleria_user} -d ${POSTGRES_DB:-carteleria_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carteleria_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carteleria_db}?schema=public
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:?Definí ADMIN_USERNAME en .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Definí ADMIN_PASSWORD en .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Cantidad de proxies delante del backend (edge = 1; con otro proxy HTTPS delante, 2)
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./player-app/index.html:/player-app/index.html:ro
      - ./player-app/boot.js:/player-app/boot.js:ro
      - ./player-app/renderer.js:/player-app/renderer.js:ro
      - ./player-app/player.css:/player-app/player.css:ro
      - ./player-app/manifest.json:/player-app/manifest.json:ro
      - ./player-app/config.js:/player-app/config.js:ro

  dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "" # mismo origen
    restart: always

  # Reparte /api, /uploads y /player al backend y el resto al dashboard (HTTP interno, sin certificados)
  edge:
    image: caddy:2-alpine
    restart: always
    ports:
      - "127.0.0.1:8095:80"
    volumes:
      - ./deploy/Caddyfile.internal:/etc/caddy/Caddyfile:ro
      - ./downloads:/srv/downloads:ro # APK del reproductor (carpeta local, fuera de git)
    depends_on:
      - backend
      - dashboard

volumes:
  pgdata:
  uploads:
